<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德州扑克双端原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #070C0A; color: #E9EFEA; font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100vh; }

  #sidebar { width: 268px; flex-shrink: 0; background: #0A100D; border-right: 1px solid rgba(232,185,68,.14); display: flex; flex-direction: column; overflow-y: auto; }
  #brand { padding: 20px 20px 16px; border-bottom: 1px solid rgba(232,185,68,.12); display: flex; align-items: center; gap: 11px; }
  #brand .mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(160deg,#1E3025,#0D1913); border: 1px solid rgba(232,185,68,.42); box-shadow: inset 0 1px 0 rgba(232,185,68,.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em; line-height: 1.15; }
  #brand p { margin: 2px 0 0; font-size: 10px; color: #6F8377; letter-spacing: .14em; }

  .nav-group { padding: 14px 12px 4px; }
  .nav-group-title { font-size: 10px; color: #6F8377; letter-spacing: .16em; padding: 0 8px 8px; }
  .nav-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 9px; padding: 9px 10px; margin-bottom: 2px; cursor: pointer; font-family: inherit; font-size: 13px; color: #A9BDB1; transition: background .12s, color .12s; }
  .nav-item:hover { background: rgba(255,255,255,.04); color: #E9EFEA; }
  .nav-item.active { background: rgba(232,185,68,.13); color: #F0C863; font-weight: 600; }
  .nav-label { flex-grow: 1; }
  .nav-badge { font-size: 9px; color: #8FC7A6; background: rgba(95,208,138,.13); border: 1px solid rgba(95,208,138,.28); border-radius: 4px; padding: 2px 5px; flex-shrink: 0; }
  .nav-item.active .nav-badge { color: #5FD08A; }

  #main { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { flex-shrink: 0; padding: 16px 26px 14px; border-bottom: 1px solid rgba(232,185,68,.1); display: flex; align-items: center; gap: 18px; }
  #screen-title { font-size: 16px; font-weight: 600; }
  #screen-size { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6F8377; }
  #zoom { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 11px; color: #7E9488; }
  #zoom button { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); color: #C7D4CB; border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-family: inherit; font-size: 13px; line-height: 1; }
  #zoom button:hover { background: rgba(255,255,255,.08); }
  #zoom .val { font-family: 'IBM Plex Mono', monospace; width: 42px; text-align: center; color: #C7D4CB; }

  #hint { flex-shrink: 0; padding: 11px 26px; background: rgba(232,185,68,.05); border-bottom: 1px solid rgba(232,185,68,.1); display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: #C2B584; line-height: 1.55; }
  #hint svg { flex-shrink: 0; margin-top: 1px; }

  #stage { flex-grow: 1; overflow: auto; padding: 26px; display: flex; justify-content: center; align-items: flex-start; }
  #frame { transform-origin: top center; flex-shrink: 0; }
  .screen { box-shadow: 0 24px 70px rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; }
  [data-ev-mousedown] { touch-action: none; user-select: none; }

  @media (max-width: 880px) {
    body { overflow: auto; }
    #app { flex-direction: column; height: auto; }
    #sidebar { width: 100%; flex-direction: row; overflow-x: auto; }
    #stage { padding: 14px; }
  }

/* Main */
#screen-Main { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-Main a { color: #E8B944; }#screen-Main a:hover { color: #F5D06F; }#screen-Main .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }#screen-Main .rng { -webkit-appearance: none; appearance: none; height: 7px; border-radius: 99px; outline: none; }#screen-Main .rng::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(160deg,#FFFDF6,#E6DCC4); border: 3px solid #E8B944; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.6), inset 0 1px 2px rgba(255,255,255,.9); }#screen-Main .back { background-image: repeating-linear-gradient(45deg, rgba(240,220,170,.22) 0 1.5px, transparent 1.5px 5px), repeating-linear-gradient(-45deg, rgba(240,220,170,.22) 0 1.5px, transparent 1.5px 5px), linear-gradient(155deg, #9A2E3C, #5C1A23); }#screen-Main .cd { border-radius: 8px; background: linear-gradient(170deg,#FFFDF7,#EFE8D6); box-shadow: 0 8px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.9); position: relative; }#screen-Main .btn { cursor: pointer; transition: filter .12s, transform .06s; }#screen-Main .btn:hover { filter: brightness(1.14); }#screen-Main .btn:active { transform: translateY(1px); }#screen-Main .ck { width: 15px; height: 15px; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }#screen-Main .ov { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(5,11,8,.76); display: flex; align-items: center; justify-content: center; z-index: 40; }
  

/* Showdown */
#screen-Showdown { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-Showdown a { color: #E8B944; }#screen-Showdown a:hover { color: #F5D06F; }#screen-Showdown .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  

/* HeadsUp */
#screen-HeadsUp { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-HeadsUp a { color: #E8B944; }#screen-HeadsUp a:hover { color: #F5D06F; }#screen-HeadsUp .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }#screen-HeadsUp .card { border-radius: 8px; background: linear-gradient(170deg,#FFFDF7,#EFE8D6); box-shadow: 0 7px 18px rgba(0,0,0,.5); position: relative; }#screen-HeadsUp .back { background-image: repeating-linear-gradient(45deg, rgba(240,220,170,.22) 0 1.5px, transparent 1.5px 5px), repeating-linear-gradient(-45deg, rgba(240,220,170,.22) 0 1.5px, transparent 1.5px 5px), linear-gradient(155deg, #9A2E3C, #5C1A23); }
  

/* WapTable */
#screen-WapTable { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-WapTable a { color: #E8B944; }#screen-WapTable a:hover { color: #F5D06F; }#screen-WapTable .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }#screen-WapTable .back { background-image: repeating-linear-gradient(45deg, rgba(240,220,170,.22) 0 1.5px, transparent 1.5px 5px), repeating-linear-gradient(-45deg, rgba(240,220,170,.22) 0 1.5px, transparent 1.5px 5px), linear-gradient(155deg, #9A2E3C, #5C1A23); }
  

/* WapRaise */
#screen-WapRaise { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-WapRaise a { color: #E8B944; }#screen-WapRaise a:hover { color: #F5D06F; }#screen-WapRaise .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }#screen-WapRaise .rng { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 99px; outline: none; }#screen-WapRaise .rng::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #F7F3E8; border: 4px solid #E8B944; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.55); }
  

/* WapStates */
#screen-WapStates { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-WapStates a { color: #E8B944; }#screen-WapStates a:hover { color: #F5D06F; }#screen-WapStates .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }#screen-WapStates .card { border-radius: 8px; background: linear-gradient(170deg,#FFFEFA,#F2EBDA); box-shadow: 0 8px 22px rgba(0,0,0,.55); position: relative; }#screen-WapStates .back { background-image: repeating-linear-gradient(45deg, rgba(240,220,170,.22) 0 1.5px, transparent 1.5px 5px), repeating-linear-gradient(-45deg, rgba(240,220,170,.22) 0 1.5px, transparent 1.5px 5px), linear-gradient(155deg, #9A2E3C, #5C1A23); }#screen-WapStates .ph { width: 390px; height: 844px; border-radius: 26px; background: radial-gradient(130% 60% at 50% 20%, #16281F 0%, #0D1813 52%, #080F0C 100%); border: 1px solid rgba(255,255,255,.09); box-shadow: 0 22px 60px rgba(0,0,0,.55); overflow: hidden; position: relative; padding-top: 44px; display: flex; flex-direction: column; }#screen-WapStates .tbl { position: absolute; left: 16px; top: 20px; right: 16px; height: 270px; border-radius: 135px / 135px; background: radial-gradient(ellipse at 50% 30%, #2C7F59 0%, #1F6845 42%, #14502F 100%); border: 6px solid #241810; box-shadow: inset 0 6px 20px rgba(0,0,0,.5); }
  

/* RunItTwice */
#screen-RunItTwice { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-RunItTwice a { color: #E8B944; }#screen-RunItTwice a:hover { color: #F5D06F; }#screen-RunItTwice .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }#screen-RunItTwice .card { border-radius: 8px; background: linear-gradient(170deg,#FFFDF7,#EFE8D6); box-shadow: 0 7px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.85); position: relative; }
  

/* EVCashout */
#screen-EVCashout { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-EVCashout a { color: #E8B944; }#screen-EVCashout a:hover { color: #F5D06F; }#screen-EVCashout .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }#screen-EVCashout .card { border-radius: 7px; background: linear-gradient(170deg,#FFFDF7,#EFE8D6); box-shadow: 0 6px 16px rgba(0,0,0,.5); position: relative; }#screen-EVCashout .rng { -webkit-appearance: none; appearance: none; height: 7px; border-radius: 99px; outline: none; }#screen-EVCashout .rng::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(160deg,#FFFDF6,#E6DCC4); border: 3px solid #E8B944; cursor: pointer; box-shadow: 0 3px 9px rgba(0,0,0,.6); }
  

/* HandDetail */
#screen-HandDetail { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-HandDetail a { color: #E8B944; }#screen-HandDetail a:hover { color: #F5D06F; }#screen-HandDetail .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }#screen-HandDetail .card { border-radius: 7px; background: linear-gradient(170deg,#FFFDF7,#EFE8D6); box-shadow: 0 5px 14px rgba(0,0,0,.45); position: relative; }#screen-HandDetail .seed { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; word-break: break-all; line-height: 1.65; }
  

/* MultiTable */
#screen-MultiTable { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-MultiTable a { color: #E8B944; }#screen-MultiTable a:hover { color: #F5D06F; }#screen-MultiTable .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }#screen-MultiTable .mc { border-radius: 4px; background: linear-gradient(170deg,#FFFDF7,#EFE8D6); box-shadow: 0 2px 6px rgba(0,0,0,.4); position: relative; }
  

/* Timebank */
#screen-Timebank { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-Timebank a { color: #E8B944; }#screen-Timebank a:hover { color: #F5D06F; }#screen-Timebank .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  

/* RiskAdmin */
#screen-RiskAdmin { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-RiskAdmin a { color: #E8B944; }#screen-RiskAdmin a:hover { color: #F5D06F; }#screen-RiskAdmin .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  

/* Benchmark */
#screen-Benchmark { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }#screen-Benchmark a { color: #E8B944; }#screen-Benchmark a:hover { color: #F5D06F; }#screen-Benchmark .n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="brand">
      <div class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="#E8B944"><path d="M12 2.6c2.9 3.6 6.4 5.7 6.4 9.4a5.7 5.7 0 0 1-8.1 5.2l.9 4.2h-2.4l.9-4.2A5.7 5.7 0 0 1 5.6 12c0-3.7 3.5-5.8 6.4-9.4Z"/></svg></div>
      <div><h1>德州扑克</h1><p>WEB &amp; WAP 双端原型</p></div>
    </div>
      <div class="nav-group">
        <div class="nav-group-title">核心牌局</div>
        <button class="nav-item" data-screen="Main">
          <span class="nav-label">Web · 牌桌主界面</span>
          <span class="nav-badge">可互动</span>
        </button>
        <button class="nav-item" data-screen="Showdown">
          <span class="nav-label">Web · 摊牌与多边池分层派彩</span>
          <span class="nav-badge">可互动</span>
        </button>
        <button class="nav-item" data-screen="HeadsUp">
          <span class="nav-label">Web · 单挑桌行动顺位反转</span>
          <span class="nav-badge">可互动</span>
        </button>
        <button class="nav-item" data-screen="WapTable">
          <span class="nav-label">WAP · 牌桌</span>
          
        </button>
        <button class="nav-item" data-screen="WapRaise">
          <span class="nav-label">WAP · 加注面板</span>
          <span class="nav-badge">可互动</span>
        </button>
        <button class="nav-item" data-screen="WapStates">
          <span class="nav-label">WAP · 关键状态三连</span>
          
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">特色机制与信任</div>
        <button class="nav-item" data-screen="RunItTwice">
          <span class="nav-label">发多次牌 Run It Twice</span>
          <span class="nav-badge">可互动</span>
        </button>
        <button class="nav-item" data-screen="EVCashout">
          <span class="nav-label">EV Cashout 折现与界面隔离</span>
          <span class="nav-badge">可互动</span>
        </button>
        <button class="nav-item" data-screen="HandDetail">
          <span class="nav-label">牌局详情 · 抽水明细与可证明公平</span>
          <span class="nav-badge">可互动</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">效率·状态·后台</div>
        <button class="nav-item" data-screen="MultiTable">
          <span class="nav-label">Web · 多桌管理</span>
          
        </button>
        <button class="nav-item" data-screen="Timebank">
          <span class="nav-label">行动倒计时与时间银行</span>
          
        </button>
        <button class="nav-item" data-screen="RiskAdmin">
          <span class="nav-label">运营后台 · 风控处置中枢</span>
          
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">竞品对标</div>
        <button class="nav-item" data-screen="Benchmark">
          <span class="nav-label">四大竞品交互对标矩阵</span>
          
        </button>
      </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <span id="screen-title"></span>
      <span id="screen-size"></span>
      <div id="zoom">
        <button id="zoom-out">−</button><span class="val" id="zoom-val">100%</span><button id="zoom-in">+</button>
        <button id="zoom-fit" style="width:auto;padding:0 9px;">适应</button>
      </div>
    </div>
    <div id="hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E8B944" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
      <span id="hint-text"></span>
    </div>
    <div id="stage"><div id="frame">
    <div class="screen" id="screen-Main" data-w="1440" data-h="900" hidden></div>
    <div class="screen" id="screen-Showdown" data-w="1440" data-h="900" hidden></div>
    <div class="screen" id="screen-HeadsUp" data-w="1440" data-h="900" hidden></div>
    <div class="screen" id="screen-WapTable" data-w="390" data-h="844" hidden></div>
    <div class="screen" id="screen-WapRaise" data-w="390" data-h="844" hidden></div>
    <div class="screen" id="screen-WapStates" data-w="1340" data-h="1000" hidden></div>
    <div class="screen" id="screen-RunItTwice" data-w="1440" data-h="900" hidden></div>
    <div class="screen" id="screen-EVCashout" data-w="1440" data-h="900" hidden></div>
    <div class="screen" id="screen-HandDetail" data-w="1440" data-h="900" hidden></div>
    <div class="screen" id="screen-MultiTable" data-w="1440" data-h="900" hidden></div>
    <div class="screen" id="screen-Timebank" data-w="1400" data-h="820" hidden></div>
    <div class="screen" id="screen-RiskAdmin" data-w="1440" data-h="900" hidden></div>
    <div class="screen" id="screen-Benchmark" data-w="1400" data-h="880" hidden></div>
    </div></div>
  </main>
</div>

<script type="text/template" id="tpl-Main">
<div style="width: 1440px; height: 900px; background: radial-gradient(130% 90% at 42% 4%, #16281F 0%, #0D1813 46%, #080F0C 100%); color: #E9EFEA; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 80px; top: -140px; width: 1000px; height: 620px; background: radial-gradient(ellipse at 50% 50%, rgba(96,196,148,.15) 0%, rgba(96,196,148,0) 62%); pointer-events: none;"></div>

  <div style="height: 58px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 22px; background: linear-gradient(180deg, #0D1A15, #0A1410); border-bottom: 1px solid rgba(232,185,68,.16); position: relative; z-index: 30;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(160deg,#1E3025,#0D1913); border: 1px solid rgba(232,185,68,.42); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(232,185,68,.22), 0 2px 8px rgba(0,0,0,.4);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#E8B944"><path d="M12 2.6c2.9 3.6 6.4 5.7 6.4 9.4a5.7 5.7 0 0 1-8.1 5.2l.9 4.2h-2.4l.9-4.2A5.7 5.7 0 0 1 5.6 12c0-3.7 3.5-5.8 6.4-9.4Z"/></svg>
      </div>
      <div>
        <div style="font-weight: 700; font-size: 15px; letter-spacing: .02em; line-height: 1.1;">德州扑克</div>
        <div style="font-size: 9px; color: #6F8377; letter-spacing: .2em;">TEXAS HOLD&#39;EM</div>
      </div>
    </div>
    <div style="width: 1px; height: 24px; background: rgba(232,185,68,.16);"></div>
    <div style="display: flex; align-items: center; gap: 11px;">
      <span style="font-size: 14px; font-weight: 600;">现金桌 · 6-Max</span>
      <span class="n" style="font-size: 13px; color: #8FA69A;">$5 / $10</span>
      <span style="font-size: 10px; color: #0E1A15; background: linear-gradient(160deg,#5FD08A,#3E9C68); border-radius: 4px; padding: 3px 7px; font-weight: 700; letter-spacing: .05em;">NL1000</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 9px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5FD08A" stroke-width="1.9"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 10h20"/></svg>
      <span class="n" style="font-size: 15px; font-weight: 600;">{{ g.balance }}</span>
    </div>

  document.getElementById('hint-text').textContent = m.hint;
  document.querySelectorAll('.nav-item').forEach(function (b) {
    b.classList.toggle('active', b.dataset.screen === name);
  });
  current = name;
  applyZoom();
  location.hash = name;
}

var current = null, zoom = null;
var frame = document.getElementById('frame'), stage = document.getElementById('stage');

function fitZoom() {
  var m = BY_NAME[current];
  var availW = stage.clientWidth - 52, availH = stage.clientHeight - 52;
  return Math.min(1, availW / m.w, availH / m.h);
}
function applyZoom() {
  var m = BY_NAME[current];
  var z = zoom === null ? fitZoom() : zoom;
  frame.style.transform = 'scale(' + z + ')';
  frame.style.width = m.w + 'px';
  frame.style.height = m.h * z + 'px';
  document.getElementById('zoom-val').textContent = Math.round(z * 100) + '%';
}

document.querySelectorAll('.nav-item').forEach(function (b) {
  b.addEventListener('click', function () { zoom = null; activate(b.dataset.screen); });
});
document.getElementById('zoom-in').addEventListener('click', function () { zoom = Math.min(2, (zoom === null ? fitZoom() : zoom) + .1); applyZoom(); });
document.getElementById('zoom-out').addEventListener('click', function () { zoom = Math.max(.2, (zoom === null ? fitZoom() : zoom) - .1); applyZoom(); });
document.getElementById('zoom-fit').addEventListener('click', function () { zoom = null; applyZoom(); });
window.addEventListener('resize', function () { if (current) applyZoom(); });

var app = document.getElementById('app');
app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-ev-click]');
  if (t) callEv(t, 'click', e);
});
['input', 'change'].forEach(function (evt) {
  app.addEventListener(evt, function (e) {
    var t = e.target.closest('[data-ev-change]');
    if (t) callEv(t, 'change', e);
  });
});
app.addEventListener('pointerdown', function (e) {
  if (e.target.tagName === 'INPUT' && e.target.type === 'range') dragEl = e.target;
  var t = e.target.closest('[data-ev-mousedown]');
  if (t) { pressEl = t; callEv(t, 'mousedown', e); }
});
var pressEl = null;
document.addEventListener('pointerup', function (e) {
  dragEl = null;
  if (pressEl) { callEv(pressEl, 'mouseup', e); pressEl = null; }
});
document.addEventListener('pointercancel', function () {
  dragEl = null;
  if (pressEl) { callEv(pressEl, 'mouseup', null); pressEl = null; }
});
app.addEventListener('mouseout', function (e) {
  var t = e.target.closest('[data-ev-mouseleave]');
  if (t && !t.contains(e.relatedTarget)) callEv(t, 'mouseleave', e);
});

var start = location.hash.replace('#', '');
activate(BY_NAME[start] ? start : META[0].name);
</script>
</body>
</html>
